# Local/dev stack. Production: see docs/deployment.md
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: plant_care
      DB_USERNAME: plant_care
      DB_PASSWORD: ${DB_PASSWORD:-plant_care_dev}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: plant_care
      MYSQL_USER: plant_care
      MYSQL_PASSWORD: ${DB_PASSWORD:-plant_care_dev}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  # Optional: docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: ["redis"]

volumes:
  db_data:
